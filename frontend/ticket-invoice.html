<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Ticket Receipt | Eventify</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .ticket-container {
      max-width: 550px;
      width: 100%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .ticket-header {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    .ticket-header h2 {
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .ticket-body {
      padding: 2.5rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .info-label {
      color: #9ca3af;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }

    .info-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f3f4f6;
    }

    .seat-badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .seat-badge-custom {
      background-color: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .divider {
      border-top: 2px dashed rgba(255, 255, 255, 0.1);
      position: relative;
      margin: 2rem 0;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #0b0f19;
      border-radius: 50%;
      top: -10px;
    }

    .divider::before { left: -35px; }
    .divider::after { right: -35px; }

    .qr-section {
      text-align: center;
      margin-top: 1.5rem;
    }

    .barcode-placeholder {
      letter-spacing: 4px;
      font-family: monospace;
      color: #9ca3af;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    /* Print styles */
    @media print {
      body {
        background-color: #ffffff;
        color: #000000;
        padding: 0;
        margin: 0;
      }
      .ticket-container {
        box-shadow: none;
        border: none;
        background: #ffffff;
        color: #000000;
        max-width: 100%;
      }
      .ticket-header {
        background: #f3f4f6 !important;
        color: #000000 !important;
        border-bottom: 2px solid #000000;
      }
      .ticket-header h2 {
        color: #000000 !important;
      }
      .info-value, .info-label {
        color: #000000 !important;
      }
      .seat-badge-custom {
        background: #f3f4f6 !important;
        color: #000000 !important;
        border: 1px solid #000000 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="ticket-container">
    <div class="ticket-header">
      <h2>E-Ticket Entry Pass</h2>
      <p class="mb-0 text-white-50 small">Eventify Booking Confirmation</p>
    </div>
    
    <div class="ticket-body">
      <div class="info-grid">
        <div>
          <div class="info-label">Customer Email</div>
          <div class="info-value" id="ticket-email">Loading...</div>
        </div>
        <div>
          <div class="info-label">Booking Reference</div>
          <div class="info-value text-primary" id="ticket-ref">#...</div>
        </div>
      </div>

      <div class="mb-4">
        <div class="info-label">Event Title</div>
        <div class="info-value fs-5 text-success" id="ticket-title">Loading...</div>
      </div>

      <div class="info-grid">
        <div>
          <div class="info-label">Date & Time</div>
          <div class="info-value" id="ticket-datetime">Loading...</div>
        </div>
        <div>
          <div class="info-label">Location / Venue</div>
          <div class="info-value" id="ticket-location">Loading...</div>
        </div>
      </div>

      <div class="mb-3">
        <div class="info-label">Reserved Seats</div>
        <div class="seat-badge-container" id="ticket-seats">
          <!-- Dynamically injected badges -->
        </div>
      </div>

      <div class="info-grid mt-4">
        <div>
          <div class="info-label">Billing Amount</div>
          <div class="info-value fs-4 text-success" id="ticket-amount">₹0.00</div>
        </div>
        <div>
          <div class="info-label">Booking Status</div>
          <div class="info-value"><span class="badge bg-success" id="ticket-status">CONFIRMED</span></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="qr-section">
        <div class="barcode-placeholder">|||||||| | | |||| ||| | ||| |||||||</div>
        <div class="small text-secondary" id="ticket-barcode-num">GATEPASS-X</div>
        
        <div class="mt-4 no-print d-flex gap-2 justify-content-center">
          <button class="btn btn-outline-light btn-sm" onclick="window.close()"><i class="fa-solid fa-circle-xmark me-1"></i>Close</button>
          <button class="btn btn-success btn-sm px-4" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print Ticket / PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('bookingId');

      if (!bookingId) {
        alert("Error: Booking ID missing from ticket URL.");
        return;
      }

      fetch(`http://localhost:8086/api/bookings/public/${bookingId}`)
        .then(res => {
          if (!res.ok) throw new Error("Ticket record not found.");
          return res.json();
        })
        .then(booking => {
          document.getElementById('ticket-email').textContent = booking.userEmail;
          document.getElementById('ticket-ref').textContent = '#' + booking.id.toUpperCase();
          document.getElementById('ticket-title').textContent = booking.eventTitle;
          document.getElementById('ticket-datetime').textContent = `${booking.eventDate} @ ${booking.eventTime}`;
          document.getElementById('ticket-location').textContent = booking.eventLocation;
          document.getElementById('ticket-amount').textContent = `₹${booking.totalPrice.toFixed(2)}`;
          document.getElementById('ticket-barcode-num').textContent = `REF-${booking.id.toUpperCase()}`;

          // Inject seats
          const seatsContainer = document.getElementById('ticket-seats');
          seatsContainer.innerHTML = '';
          const seats = booking.seats.split(', ');
          seats.forEach(s => {
            const badge = document.createElement('span');
            badge.className = 'seat-badge-custom';
            badge.textContent = s;
            seatsContainer.appendChild(badge);
          });
        })
        .catch(err => {
          alert("Error loading ticket: " + err.message);
        });
    });
  </script>
</body>
</html>
