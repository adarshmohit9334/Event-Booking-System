<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizer Console | Eventify</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-surface: #111827;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .custom-nav {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Dashboard Container */
    .dashboard-container {
      flex: 1;
      padding: 2.5rem 1rem;
    }

    /* KPI Cards */
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .kpi-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent);
    }

    .kpi-val {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* Content Area */
    .content-box {
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      margin-top: 2rem;
    }

    /* Form Fields */
    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }

    .form-control:focus, .form-select:focus {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      color: var(--text-main);
      box-shadow: none;
    }

    .btn-accent {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-accent:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      color: white;
    }

    /* Custom Tables */
    .custom-table {
      color: var(--text-main);
    }

    .custom-table th {
      color: var(--text-muted);
      font-weight: 700;
      border-bottom: 2px solid var(--glass-border);
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .custom-table td {
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0.5rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg custom-nav">
    <div class="container">
      <a class="navbar-brand fs-3" href="#"><i class="fa-solid fa-bolt me-2"></i>EVENTIFY</a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50" id="organizer-profile-name">Organizer Console</span>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fa-solid fa-power-off me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <!-- Container -->
  <div class="container dashboard-container">
    <div class="row g-4">
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-icon"><i class="fa-solid fa-calendar-days"></i></div>
          <div>
            <div class="text-white-50 small">Active Events</div>
            <div class="kpi-val" id="kpi-active-events">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981;"><i class="fa-solid fa-ticket"></i></div>
          <div>
            <div class="text-white-50 small">Total Tickets Sold</div>
            <div class="kpi-val text-success" id="kpi-tickets-sold">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card">
          <div class="kpi-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;"><i class="fa-solid fa-indian-rupee-sign"></i></div>
          <div>
            <div class="text-white-50 small">Estimated Revenue</div>
            <div class="kpi-val text-warning" id="kpi-revenue">₹0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content-box">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 font-weight-bold">My Managed Events</h4>
        <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#createEventModal"><i class="fa-solid fa-plus me-1"></i>Launch New Event</button>
      </div>

      <div class="table-responsive">
        <table class="table table-dark table-hover custom-table">
          <thead>
            <tr>
              <th>Event Title</th>
              <th>Date & Time</th>
              <th>Venue / Location</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="events-table-body">
            <!-- Dynamic events go here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create Event Modal -->
  <div class="modal fade" id="createEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary">
          <h5 class="modal-title"><i class="fa-solid fa-calendar-plus me-2 text-primary"></i>Launch New Event</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="createEventForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small">Event Title</label>
              <input type="text" class="form-control" id="eventTitle" required placeholder="e.g. Rock Concert Live">
            </div>
            <div class="mb-3">
              <label class="form-label small">Description</label>
              <textarea class="form-control" id="eventDescription" rows="3" placeholder="Tell users about this event..." required></textarea>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small">Date</label>
                <input type="date" class="form-control" id="eventDate" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Time</label>
                <input type="time" class="form-control" id="eventTime" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Venue Location</label>
              <input type="text" class="form-control" id="eventLocation" required placeholder="e.g. Wembley Stadium, London">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small">Category</label>
                <select class="form-select" id="eventCategory">
                  <option value="Concerts">Concerts</option>
                  <option value="Sports">Sports</option>
                  <option value="Theater">Theater</option>
                  <option value="Comedy">Comedy</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Event Image Url</label>
                <input type="text" class="form-control" id="eventImage" placeholder="e.g. assets/rock.jpg">
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <label class="form-label small">VIP Seat Price (₹)</label>
                <input type="number" class="form-control" id="priceVIP" value="1500" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Gold Seat Price (₹)</label>
                <input type="number" class="form-control" id="priceGold" value="1000" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small">Standard (₹)</label>
                <input type="number" class="form-control" id="priceStandard" value="500" required>
              </div>
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-accent">Publish & Generate Seats</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = localStorage.getItem('etbs_token');
    const userRole = localStorage.getItem('etbs_role');

    if (!token || userRole !== 'organizer') {
      alert("Unauthorized Access. Redirecting to login.");
      window.location.href = 'login.html';
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadOrganizerDashboard();
      
      document.getElementById('createEventForm').addEventListener('submit', (e) => {
        e.preventDefault();
        publishNewEvent();
      });
    });

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function fetchFromBackend(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
        ...options.headers
      };
      return fetch('http://localhost:8086' + endpoint, {
        ...options,
        headers
      }).then(res => {
        if (!res.ok) {
          return res.text().then(text => { throw new Error(text || 'Request failed') });
        }
        return res.json();
      });
    }

    function loadOrganizerDashboard() {
      fetchFromBackend('/api/events/organizer')
        .then(events => {
          document.getElementById('kpi-active-events').textContent = events.length;
          
          const tbody = document.getElementById('events-table-body');
          tbody.innerHTML = '';
          
          events.forEach(ev => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${ev.title}</strong></td>
              <td>${ev.date} @ ${ev.time}</td>
              <td>${ev.location}</td>
              <td><span class="badge bg-secondary">${ev.category}</span></td>
              <td>
                <button class="btn btn-outline-info btn-sm" onclick="showSeatSales('${ev.id}')">
                  <i class="fa-solid fa-chart-pie me-1"></i>Seat Details
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          alert("Error loading dashboard: " + err.message);
        });
    }

    function publishNewEvent() {
      const title = document.getElementById('eventTitle').value;
      const description = document.getElementById('eventDescription').value;
      const date = document.getElementById('eventDate').value;
      const time = document.getElementById('eventTime').value;
      const location = document.getElementById('eventLocation').value;
      const category = document.getElementById('eventCategory').value;
      const image = document.getElementById('eventImage').value || 'assets/default.jpg';
      const priceVIP = parseFloat(document.getElementById('priceVIP').value);
      const priceGold = parseFloat(document.getElementById('priceGold').value);
      const priceStandard = parseFloat(document.getElementById('priceStandard').value);

      fetchFromBackend('/api/events', {
        method: 'POST',
        body: JSON.stringify({
          title, description, date, time, location, category, image,
          priceVIP, priceGold, priceStandard
        })
      })
      .then(res => {
        alert("Event published and 60 seats successfully generated!");
        const modalEl = document.getElementById('createEventModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        document.getElementById('createEventForm').reset();
        loadOrganizerDashboard();
      })
      .catch(err => {
        alert("Failed to publish event: " + err.message);
      });
    }

    function showSeatSales(eventId) {
      alert("Sales breakdown feature coming soon!");
    }
  </script>
</body>
</html>
